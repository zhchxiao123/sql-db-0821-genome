id: decision-employee
name: 决策员工
runtime: claude-code
model: default
prompt: prompts/decision.md
procedures:
- requirement-analysis
- itest-decide
crafts:
- acceptance-authoring
- requirement-normalization
- case-specification
- vertical-slicing
- codebase-survey
- genome-navigation
- output-discipline
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - tasks/{task_id}/**
  forbid_paths:
  - repos/**
  - genome/**
assignee: ''
