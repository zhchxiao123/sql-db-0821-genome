# 开发数字员工。业务代码的唯一书写者。
id: dev-employee
name: 开发员工
runtime: claude-code
model: default
prompt: prompts/dev.md

# `round-reflect` 挂在这里而不是架构员工名下:它读的是**这次修复的现场**——刚挂的门禁、
# 上一轮自己写的代码。那是干活的人的视角,不是治理项目认知的人的视角。
procedures: [code-develop, unit-gate, round-reflect]

# 修复轮的纪律:先诊断后动手。不带它的失败模式非常固定——第一轮改一个看起来相关的地方,
# 第二轮再改,第三轮撞上修复轮次上限,而人接手后发现真正的原因写在第一轮报告的第二行里。
# 红绿循环的纪律,以及「这次该把什么藏起来」。**test-first 是手艺约束不是机制约束**,
# 而在 tdd-loop 之前那句话是空的:缺省档下没有任何地方讲过红→绿怎么走。
crafts:
  - tdd-loop
  - module-design
  - failure-diagnosis
  - genome-navigation
  - output-discipline

tools:
  allow: [Read, Grep, Glob, Write, Edit, Bash]
  deny: [WebFetch, WebSearch]

permissions:
  # 只能写**本任务计划命中的模块**与本任务目录——不是所有业务仓,也不是所有任务目录。
  # `{task_modules}` 在派发时按计划展开成每个模块一条;计划里一个模块都没有时它展开成零条,
  # 于是这个员工一行业务代码都写不进去,而那正是想要的:计划没写清楚该当场卡住。
  write_paths: ["{task_modules}/**", "tasks/{task_id}/**"]
  # 改了规则就能自己给自己开绿灯;改了 CI 与子模块指针同理。
  forbid_paths: ["genome/rules/**", ".github/**", ".gitmodules"]

