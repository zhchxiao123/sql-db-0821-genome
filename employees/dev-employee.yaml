id: dev-employee
name: 开发员工
runtime: agentteams
model: default
prompt: prompts/dev.md
procedures:
- code-develop
- unit-gate
- round-reflect
crafts:
- tdd-loop
- module-design
- failure-diagnosis
- genome-navigation
- output-discipline
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - '{task_modules}/**'
  - tasks/{task_id}/**
  forbid_paths:
  - genome/rules/**
  - .github/**
  - .gitmodules
assignee: ''
