id: arch-employee
name: 架构员工
runtime: claude-code
model: default
prompt: prompts/arch.md
procedures:
- experience-distill
crafts:
- map-authoring
- codebase-survey
- genome-navigation
- output-discipline
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - genome/**
  - tasks/{task_id}/**
  forbid_paths:
  - repos/**
assignee: ''
