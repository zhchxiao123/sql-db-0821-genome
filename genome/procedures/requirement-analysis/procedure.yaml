id: requirement-analysis
version: 1.3.0
summary: 读需求与项目地图,产出范围界定、规范化需求、验收标准与用例规格;拆不动时产出拆分提案
kind: agentic
ownership: plan
trigger:
  states:
  - CREATED
inputs:
  schema:
    type: object
    required:
    - requirement
    properties:
      requirement:
        type: string
      task_id:
        type: string
outputs:
  artifacts:
  - scope.md
  - requirements.md
  - cases/
  - closure.md
  schema_ref: schemas/out.json
compat:
  runtimes:
  - claude-code
  - agentteams
