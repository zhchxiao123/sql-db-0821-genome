id: code-develop
version: 1.0.0
summary: 在授权的业务仓里实现需求并让本模块测试通过
kind: agentic
trigger:
  states:
  - DEVELOPING
inputs:
  schema:
    type: object
    required:
    - requirement
    properties:
      requirement:
        type: string
      module_ids:
        type: array
        items:
          type: string
outputs:
  schema_ref: schemas/out.json
compat:
  runtimes:
  - claude-code
  - agentteams
