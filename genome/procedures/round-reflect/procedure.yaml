id: round-reflect
version: 1.0.0
summary: 一轮修复失败之后,写下一条关于"这次为什么错"的假设,供下一轮验证
kind: agentic
inputs:
  schema:
    type: object
    properties:
      task_id:
        type: string
      round:
        type: integer
      failure:
        type: string
outputs:
  schema_ref: schemas/out.json
budget:
  max_tokens: 100000000
compat:
  runtimes:
  - claude-code
  - agentteams
