id: adversarial-probe
version: 1.0.0
summary: 以不变量为攻击清单构造边界与异常输入,每条发现带复现命令
kind: agentic
trigger:
  states:
  - UNIT_TESTING
inputs:
  schema:
    type: object
    properties:
      task_id:
        type: string
      changed_files:
        type: array
        items:
          type: string
      acceptance:
        type: array
        items:
          type: string
      invariants:
        type: array
        items:
          type: string
outputs:
  schema_ref: schemas/out.json
budget:
  max_tokens: 100000000
compat:
  runtimes:
  - claude-code
  - agentteams
